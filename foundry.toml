[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/src/",
    "v4-core-test/=lib/v4-core/test/",
    "v4-periphery/=lib/v4-periphery/src/",
    "v4-periphery-test/=lib/v4-periphery/test/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-core/lib/solmate/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "@fhenixprotocol/cofhe-contracts/=lib/cofhe-contracts/contracts/",
    "@fhenixprotocol/cofhe-mock-contracts/=lib/cofhe-mock-contracts/contracts/",
    "cofhe-mocks/=lib/cofhe-mock-contracts/contracts/",
    "hardhat/=lib/forge-std/src/",
]

[rpc_endpoints]
# CoFHE and Uniswap v4 are both live here, which is why it is the default target.
sepolia = "${SEPOLIA_RPC:-https://ethereum-sepolia-rpc.publicnode.com}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://unichain-sepolia.blockscout.com/api" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://base-sepolia.blockscout.com/api" }
